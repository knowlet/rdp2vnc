[package]
name = "rdp2vnc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "A minimal, secure-by-default RDP-to-VNC CLI bridge"
repository = "https://github.com/knowlet/rdp2vnc"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aes = { version = "0.8", features = ["zeroize"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
des = { version = "0.8", features = ["zeroize"] }
directories = "6"
flate2 = "1"
getrandom = "0.2"
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "8e76c3168da578826d8fd707503655ea16bd3392", default-features = false, features = ["helper"] }
md-5 = "0.10"
num-bigint = "0.4"
ratatui = "0.29"
rcgen = "0.13"
rpassword = "7"
rustls-pemfile = "2"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
