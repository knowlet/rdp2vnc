# Temporary branch-scoped implementation workspace; removed from the final PR diff.
name: Bootstrap bridge
on:
  push:
    branches: [feat/rust-rdp-vnc-bridge]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'knowlet/rdp2vnc' && github.ref == 'refs/heads/feat/rust-rdp-vnc-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/rust-rdp-vnc-bridge
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Apply reviewed strict-lint fixes
        shell: python
        run: |
          from pathlib import Path
          def edit(name, old, new, count=1):
              path = Path(name)
              text = path.read_text()
              assert text.count(old) == count, (name, old, text.count(old))
              path.write_text(text.replace(old, new))
          edit('src/auth.rs', '.chunks_exact_mut(8)', '.as_chunks_mut::<8>().0')
          edit('src/auth.rs', '.chunks_exact_mut(16)', '.as_chunks_mut::<16>().0', 2)
          edit('src/framebuffer.rs', '.chunks_exact_mut(4).enumerate()', '.as_chunks_mut::<4>().0.iter_mut().enumerate()')
          edit('src/framebuffer.rs', '.chunks_exact_mut(4)', '.as_chunks_mut::<4>().0')
          edit('src/rfb.rs', '        let security;\n        if tls {', '        let security = if tls {')
          edit('src/rfb.rs', '            security = "VeNCrypt X509/TLS";', '            "VeNCrypt X509/TLS"')
          edit('src/rfb.rs', '            security = if protected {', '            if protected {')
          edit('src/rfb.rs', '                "UNENCRYPTED (explicit opt-in)"\n            };\n        }', '                "UNENCRYPTED (explicit opt-in)"\n            }\n        };')
          license_text = Path('/usr/share/common-licenses/Apache-2.0').read_text()
          assert 'Apache License' in license_text and 'TERMS AND CONDITIONS' in license_text
          Path('LICENSE').write_text(license_text)
      - name: Format and commit reviewed changes
        run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src LICENSE
          git diff --cached --check
          git commit -m 'fix: satisfy strict lints and include the Apache license'
          git push origin HEAD:refs/heads/feat/rust-rdp-vnc-bridge
      - name: Test exact generated tree
        run: cargo test --locked --all-targets
      - name: Clippy
        if: always()
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        if: always()
        run: cargo fmt --all -- --check
      - name: Build CLI
        if: always()
        run: cargo build --locked
      - name: Install loopback integration dependencies
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freerdp3-x11 xvfb xauth xdotool python3-pil
      - name: Real FreeRDP integration
        if: always()
        run: xvfb-run -a -s '-screen 0 1024x768x24' /usr/bin/python3 tests/e2e_freerdp.py
