name: Rust CI
on:
  push:
    branches: [develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
jobs:
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Minimum supported Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Test on Rust 1.94
        run: cargo +1.94.0 test --locked --all-targets
      - name: Build CLI on Rust 1.94
        run: cargo +1.94.0 build --locked
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Test
        run: cargo test --locked --all-targets
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build CLI
        run: cargo build --locked
      - name: Verify complete locked PEM dependency graph
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          lock_path = pathlib.Path('Cargo.lock')
          original = lock_path.read_bytes()
          packages = tomllib.loads(original.decode('utf-8'))['package']
          pem = [p for p in packages if p['name'] == 'rustls-pemfile']
          consumers = {
              p['name'] for p in packages
              if any(d.split()[0] == 'rustls-pemfile' for d in p.get('dependencies', []))
          }
          if consumers - {'ironrdp-server'}:
              raise SystemExit(f'Unexpected rustls-pemfile consumers: {sorted(consumers)}')
          if pem:
              print('RUSTSEC-2025-0134 remains in Cargo.lock; direct migration is not full removal.', flush=True)
              print(f'Locked versions: {[p["version"] for p in pem]}; consumers: {sorted(consumers)}', flush=True)
              subprocess.run([
                  'cargo', 'tree', '--locked', '--target', 'all',
                  '--edges', 'normal,build,dev', '--invert', 'rustls-pemfile',
              ], check=True)
          else:
              print('rustls-pemfile is absent from the complete Cargo.lock; this is not a full security audit.', flush=True)
          if lock_path.read_bytes() != original:
              raise SystemExit('Dependency inspection unexpectedly changed Cargo.lock')
          PY
      - name: Install loopback E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freerdp3-x11 xvfb xauth xdotool python3-pil
      - name: Real FreeRDP loopback integration
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1024x768x24' /usr/bin/python3 tests/e2e_freerdp.py
      - name: Loopback connection resource stress
        if: runner.os == 'Linux'
        run: /usr/bin/python3 tests/stress_connections.py
