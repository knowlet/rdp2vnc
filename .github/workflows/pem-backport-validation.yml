name: PEM backport candidate validation

on:
  push:
    branches: [ci/pem-backport-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pem-backport-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  candidate:
    name: Candidate / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, '1.94.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the original immutable IronRDP revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Devolutions/IronRDP
          ref: 8e76c3168da578826d8fd707503655ea16bd3392
          path: .ci/ironrdp
          persist-credentials: false
      - name: Install the selected Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt,clippy
      - name: Prepare the validation-only PEM backport and verify its exact lock delta
        run: python tests/prepare_pem_backport.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint the candidate
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test the candidate
        run: cargo test --locked --all-targets
      - name: Build the candidate CLI
        run: cargo build --locked
      - name: Verify the complete locked candidate dependency graph
        run: python tests/check_pem_graph.py
      - name: Install loopback E2E dependencies
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freerdp3-x11 xvfb xauth xdotool python3-pil openssl
      - name: Real FreeRDP integration with the generated PEM identity
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: xvfb-run -a -s '-screen 0 1024x768x24' /usr/bin/python3 tests/e2e_freerdp.py
      - name: Real FreeRDP integration with the legacy PKCS8 identity
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: xvfb-run -a -s '-screen 0 1024x768x24' /usr/bin/python3 tests/e2e_freerdp.py --legacy-identity
      - name: Loopback connection resource stress
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: /usr/bin/python3 tests/stress_connections.py
