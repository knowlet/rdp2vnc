name: Run Issue 11 migration
on:
  push:
    branches: [refactor/issue-11-pemobject]
    paths: [.github/workflows/issue-11-run.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'knowlet/rdp2vnc' && github.ref == 'refs/heads/refactor/issue-11-pemobject'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/issue-11-pemobject
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Execute the scoped baseline, migration and validation scripts
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          lines = Path('.github/workflows/issue-11-prepare.yml').read_text().splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              body = []
              while index < len(lines) and (lines[index].startswith('          ') or not lines[index]):
                  body.append(lines[index][10:] if lines[index] else '')
                  index += 1
              scripts.append('\n'.join(body) + '\n')
          assert len(scripts) == 3, 'Unexpected preparation workflow structure'
          old = 'assert!(matches!(tls_error, rustls::Error::InvalidCertificate(rustls::CertificateError::UnknownIssuer)), "{tls_error:?}");'
          new = '''// Both generated certificates have the same issuer name but different keys.
                      // Preserve the baseline distinction: no anchor versus a wrong-key anchor.
                      if ca.is_some() {
                          assert!(matches!(tls_error, rustls::Error::InvalidCertificate(rustls::CertificateError::BadSignature)), "{tls_error:?}");
                      } else {
                          assert!(matches!(tls_error, rustls::Error::InvalidCertificate(rustls::CertificateError::UnknownIssuer)), "{tls_error:?}");
                      }'''
          assert scripts[0].count(old) == 1
          scripts[0] = scripts[0].replace(old, new)
          for name, script in zip(('Baseline regression tests', 'Migration and locked validation', 'Publish candidate'), scripts):
              # Normalize pre-existing CRLF before producing the CRLF fixture.
              script = script.replace("bundle.replace('\\n', \"\\r\\n\")", "bundle.replace(\"\\r\\n\", \"\\n\").replace('\\n', \"\\r\\n\")")
              print(f'::group::{name}', flush=True)
              completed = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script])
              if completed.returncode:
                  sys.exit(completed.returncode)
              print('::endgroup::', flush=True)
          PY
