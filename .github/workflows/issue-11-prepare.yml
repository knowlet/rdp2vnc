name: Prepare Issue 11 migration
on:
  push:
    branches: [refactor/issue-11-pemobject]
    paths: [.github/workflows/issue-11-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'knowlet/rdp2vnc' && github.ref == 'refs/heads/refactor/issue-11-pemobject'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/issue-11-pemobject
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Add behavioral regressions against the original implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '536be2c1f986c3471cbbe294d85c132645368f84'
          for name in ('Cargo.toml', 'Cargo.lock', 'src/rfb.rs', 'src/tls.rs'):
              expected = subprocess.check_output(['git', 'show', f'{base}:{name}'])
              assert Path(name).read_bytes() == expected, f'Unexpected concurrent modification: {name}'
          uses = [(str(p), i) for p in Path('src').rglob('*.rs') for i, line in enumerate(p.read_text().splitlines(), 1) if 'rustls_pemfile' in line]
          print('All application rustls_pemfile call sites:', uses)
          assert uses == [('src/rfb.rs', 203)], uses
          rfb_tests = r'''//! Exercise the production VeNCrypt path, not a substitute certificate verifier.
          use super::*;
          use std::path::Path;
          use tokio_rustls::rustls::pki_types::PrivateKeyDer;
          use tokio_rustls::TlsAcceptor;

          fn certificate() -> (rcgen::Certificate, rcgen::KeyPair) {
              let key = rcgen::KeyPair::generate().unwrap();
              let cert = rcgen::CertificateParams::new(vec!["localhost".into()])
                  .unwrap().self_signed(&key).unwrap();
              (cert, key)
          }

          async fn connect(
              ca: Option<&Path>,
              cert: &rcgen::Certificate,
              key: &rcgen::KeyPair,
              host: &str,
              version: &'static rustls::SupportedProtocolVersion,
          ) -> (Result<()>, Result<rustls::ProtocolVersion>) {
              let _ = rustls::crypto::ring::default_provider().install_default();
              let config = rustls::ServerConfig::builder_with_provider(Arc::new(
                  rustls::crypto::ring::default_provider(),
              ))
              .with_protocol_versions(&[version]).unwrap()
              .with_no_client_auth()
              .with_single_cert(vec![cert.der().clone()], PrivateKeyDer::Pkcs8(key.serialize_der().into()))
              .unwrap();
              let acceptor = TlsAcceptor::from(Arc::new(config));
              let (client, mut server) = tokio::io::duplex(65536);
              let options = Options {
                  auth: Auth::None,
                  username: None,
                  password: Zeroizing::new(String::new()),
                  allow_insecure: false,
                  ca: ca.map(Path::to_path_buf),
              };
              let client = async {
                  let (mut stream, auth) = vencrypt(Box::new(client), host, &options).await?;
                  ensure!(auth == 1, "unexpected post-TLS authentication");
                  ensure!(stream.read_u8().await? == 0x55, "missing authenticated payload");
                  stream.write_u8(0xaa).await?;
                  stream.flush().await?;
                  Ok(())
              };
              let server = async move {
                  server.write_all(&[0, 2]).await?;
                  server.flush().await?;
                  let mut version = [0; 2];
                  server.read_exact(&mut version).await?;
                  ensure!(version == [0, 2], "unexpected VeNCrypt version");
                  server.write_all(&[0, 1]).await?;
                  server.write_u32(260).await?;
                  server.flush().await?;
                  ensure!(server.read_u32().await? == 260, "unexpected VeNCrypt subtype");
                  server.write_u8(1).await?;
                  server.flush().await?;
                  let mut stream = acceptor.accept(server).await?;
                  let version = stream.get_ref().1.protocol_version().context("TLS version absent")?;
                  stream.write_u8(0x55).await?;
                  stream.flush().await?;
                  ensure!(stream.read_u8().await? == 0xaa, "missing client confirmation");
                  Ok(version)
              };
              tokio::time::timeout(Duration::from_secs(5), async { tokio::join!(client, server) })
                  .await.expect("VeNCrypt fixture timed out")
          }

          #[tokio::test]
          async fn pem_ca_trust_succeeds_for_tls12_and_tls13() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("trusted.crt");
              std::fs::write(&ca, cert.pem()).unwrap();
              for (version, expected) in [
                  (&rustls::version::TLS12, rustls::ProtocolVersion::TLSv1_2),
                  (&rustls::version::TLS13, rustls::ProtocolVersion::TLSv1_3),
              ] {
                  let (client, server) = connect(Some(&ca), &cert, &key, "localhost", version).await;
                  client.unwrap();
                  assert_eq!(server.unwrap(), expected);
              }
          }

          #[tokio::test]
          async fn pem_ca_bundle_accepts_multiple_certs_crlf_and_unrelated_sections() {
              let (cert, key) = certificate();
              let (other, _) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("bundle.pem");
              // Generated keys are disposable, in-memory fixtures, never repository data.
              let bundle = format!("\n# roots\n{}{}{}\n", other.pem(), key.serialize_pem(), cert.pem());
              std::fs::write(&ca, bundle.replace('\n', "\r\n")).unwrap();
              let (client, server) = connect(Some(&ca), &cert, &key, "localhost", &rustls::version::TLS13).await;
              client.unwrap();
              server.unwrap();
          }

          #[tokio::test]
          async fn pem_ca_empty_whitespace_and_key_only_keep_empty_chain_error() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("empty.pem");
              for text in [String::new(), " \t\r\n\n".into(), key.serialize_pem()] {
                  std::fs::write(&ca, text).unwrap();
                  let (client, _) = connect(Some(&ca), &cert, &key, "localhost", &rustls::version::TLS13).await;
                  assert_eq!(client.unwrap_err().to_string(), "VNC CA file contains no certificates");
              }
          }

          #[tokio::test]
          async fn pem_ca_malformed_and_truncated_input_remain_invalid_data() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("broken.pem");
              for text in [
                  "-----BEGIN CERTIFICATE-----\n!!!!\n-----END CERTIFICATE-----\n",
                  "-----BEGIN CERTIFICATE-----\nAQID\n",
              ] {
                  for prefix in [String::new(), cert.pem()] {
                      std::fs::write(&ca, format!("{prefix}{text}")).unwrap();
                      let (client, _) = connect(Some(&ca), &cert, &key, "localhost", &rustls::version::TLS13).await;
                      let error = client.unwrap_err();
                      assert_eq!(error.downcast_ref::<std::io::Error>().unwrap().kind(), std::io::ErrorKind::InvalidData);
                  }
              }
          }

          #[tokio::test]
          async fn pem_ca_invalid_der_is_not_silently_ignored() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("invalid-der.pem");
              std::fs::write(&ca, format!("{}-----BEGIN CERTIFICATE-----\nAQID\n-----END CERTIFICATE-----\n", cert.pem())).unwrap();
              let (client, _) = connect(Some(&ca), &cert, &key, "localhost", &rustls::version::TLS13).await;
              assert!(matches!(client.unwrap_err().downcast_ref::<rustls::Error>(), Some(rustls::Error::InvalidCertificate(_))));
          }

          #[tokio::test]
          async fn pem_ca_missing_file_preserves_open_context_and_io_error() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let (client, _) = connect(Some(&dir.path().join("missing.pem")), &cert, &key, "localhost", &rustls::version::TLS13).await;
              let error = client.unwrap_err();
              assert_eq!(error.to_string(), "opening VNC CA certificate");
              assert_eq!(error.downcast_ref::<std::io::Error>().unwrap().kind(), std::io::ErrorKind::NotFound);
          }

          #[tokio::test]
          async fn pem_ca_untrusted_certificate_has_no_insecure_fallback() {
              let (cert, key) = certificate();
              let (other, _) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("unrelated.pem");
              std::fs::write(&ca, other.pem()).unwrap();
              for ca in [None, Some(ca.as_path())] {
                  for version in [&rustls::version::TLS12, &rustls::version::TLS13] {
                      let (client, _) = connect(ca, &cert, &key, "localhost", version).await;
                      let error = client.unwrap_err();
                      assert_eq!(error.to_string(), "VNC TLS validation failed (no insecure certificate fallback)");
                      let tls_error = error.downcast_ref::<std::io::Error>().unwrap().get_ref().unwrap().downcast_ref::<rustls::Error>().unwrap();
                      assert!(matches!(tls_error, rustls::Error::InvalidCertificate(rustls::CertificateError::UnknownIssuer)), "{tls_error:?}");
                  }
              }
          }

          #[tokio::test]
          async fn pem_ca_trusted_certificate_still_requires_matching_hostname() {
              let (cert, key) = certificate();
              let dir = tempfile::tempdir().unwrap();
              let ca = dir.path().join("trusted.pem");
              std::fs::write(&ca, cert.pem()).unwrap();
              let (client, _) = connect(Some(&ca), &cert, &key, "wrong.invalid", &rustls::version::TLS13).await;
              let error = client.unwrap_err();
              let tls_error = error.downcast_ref::<std::io::Error>().unwrap().get_ref().unwrap().downcast_ref::<rustls::Error>().unwrap();
              assert!(matches!(tls_error, rustls::Error::InvalidCertificate(_)));
              assert!(format!("{tls_error:?}").contains("NotValidForName"), "{tls_error:?}");
          }
          '''
          tls_tests = r'''//! Preserve the unchanged IronRDP identity loader and key-matching policy.
          use super::*;
          use clap::Parser;

          fn certificate() -> (String, String) {
              let key = rcgen::KeyPair::generate().unwrap();
              let cert = rcgen::CertificateParams::new(vec!["localhost".into()])
                  .unwrap().self_signed(&key).unwrap();
              (cert.pem(), key.serialize_pem())
          }

          fn args(dir: &Path, cert_name: &str, key_name: &str, cert: &[u8], key: &[u8]) -> Args {
              let _ = rustls::crypto::ring::default_provider().install_default();
              let mut args = Args::parse_from(["rdp2vnc"]);
              let cert_path = dir.join(cert_name);
              let key_path = dir.join(key_name);
              private_write(&cert_path, cert).unwrap();
              private_write(&key_path, key).unwrap();
              args.cert = Some(cert_path);
              args.key = Some(key_path);
              args
          }

          #[test]
          fn pem_identity_and_legacy_extensions_preserve_certificate_and_key() {
              let (cert, key) = certificate();
              for (cert_name, key_name) in [("server.pem", "key.pem"), ("server.crt", "server.key")] {
                  let dir = tempfile::tempdir().unwrap();
                  let args = args(dir.path(), cert_name, key_name, cert.as_bytes(), key.as_bytes());
                  let (acceptor, public_key) = identity(&args).unwrap();
                  assert!(!public_key.is_empty());
                  assert!(!acceptor.config().key_log.will_log("CLIENT_RANDOM"));
                  assert_eq!(identity(&args).unwrap().1, public_key);
                  assert_eq!(fs::read(args.cert.unwrap()).unwrap(), cert.as_bytes());
                  assert_eq!(fs::read(args.key.unwrap()).unwrap(), key.as_bytes());
              }
          }

          #[test]
          fn pem_identity_rejects_empty_damaged_certificates_without_rotation() {
              let (_, key) = certificate();
              for cert in [
                  "", " \r\n\t", "damaged certificate",
                  "-----BEGIN CERTIFICATE-----\n!!!!\n-----END CERTIFICATE-----\n",
                  "-----BEGIN CERTIFICATE-----\nAQID\n",
                  "-----BEGIN CERTIFICATE-----\nAQID\n-----END CERTIFICATE-----\n",
              ] {
                  let dir = tempfile::tempdir().unwrap();
                  let args = args(dir.path(), "server.pem", "key.pem", cert.as_bytes(), key.as_bytes());
                  assert!(identity(&args).is_err());
                  assert_eq!(fs::read(args.cert.unwrap()).unwrap(), cert.as_bytes());
                  assert_eq!(fs::read(args.key.unwrap()).unwrap(), key.as_bytes());
              }
          }

          #[test]
          fn pem_identity_rejects_empty_damaged_or_mismatched_keys_without_rotation() {
              let (cert, _) = certificate();
              let (_, different_key) = certificate();
              for key in [
                  "", " \r\n\t", "damaged key",
                  "-----BEGIN PRIVATE KEY-----\n!!!!\n-----END PRIVATE KEY-----\n",
                  "-----BEGIN PRIVATE KEY-----\nAQID\n",
                  "-----BEGIN PRIVATE KEY-----\nAQID\n-----END PRIVATE KEY-----\n",
                  cert.as_str(), different_key.as_str(),
              ] {
                  let dir = tempfile::tempdir().unwrap();
                  let args = args(dir.path(), "server.pem", "key.pem", cert.as_bytes(), key.as_bytes());
                  assert!(identity(&args).is_err());
                  assert_eq!(fs::read(args.cert.unwrap()).unwrap(), cert.as_bytes());
                  assert_eq!(fs::read(args.key.unwrap()).unwrap(), key.as_bytes());
              }
          }
          '''
          for module, tests in [('rfb', rfb_tests), ('tls', tls_tests)]:
              path = Path(f'src/{module}/pem_tests.rs')
              assert not path.exists()
              path.parent.mkdir(exist_ok=True)
              path.write_text(tests)
              source = Path(f'src/{module}.rs')
              source.write_text(source.read_text().rstrip() + '\n\n#[cfg(test)]\nmod pem_tests;\n')
          PY
          cargo fmt --all
          cargo test --locked --all-targets
      - name: Migrate the direct consumer and let Cargo update the lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          text = p.read_text()
          assert text.count('rustls-pemfile = "2"\n') == 1
          p.write_text(text.replace('rustls-pemfile = "2"\n', ''))
          p = Path('src/rfb.rs')
          text = p.read_text()
          old = 'use tokio_rustls::{TlsConnector, rustls};'
          assert text.count(old) == 1
          text = text.replace(old, 'use tokio_rustls::rustls::pki_types::{CertificateDer, pem::{self, PemObject}};\n' + old)
          old = 'let certs = rustls_pemfile::certs(&mut pem).collect::<std::io::Result<Vec<_>>>()?;'
          assert text.count(old) == 1
          text = text.replace(old, 'let certs = CertificateDer::pem_reader_iter(&mut pem)\n            .map(|cert| cert.map_err(pem_error_to_io))\n            .collect::<std::io::Result<Vec<_>>>()?;')
          marker = 'fn client_tls_config(roots: rustls::RootCertStore) -> rustls::ClientConfig {'
          adapter = r'''// Keep the previous parser's I/O error kind and diagnostics while using
          // the maintained PemObject implementation through rustls's supported re-export.
          fn pem_error_to_io(error: pem::Error) -> std::io::Error {
              use std::io::{Error, ErrorKind};
              match error {
                  pem::Error::Io(error) => error,
                  pem::Error::MissingSectionEnd { end_marker } => Error::new(
                      ErrorKind::InvalidData,
                      format!("section end {:?} missing", String::from_utf8_lossy(&end_marker)),
                  ),
                  pem::Error::IllegalSectionStart { line } => Error::new(
                      ErrorKind::InvalidData,
                      format!("illegal section start: {:?}", String::from_utf8_lossy(&line)),
                  ),
                  pem::Error::Base64Decode(error) => Error::new(ErrorKind::InvalidData, error),
                  other => Error::new(ErrorKind::InvalidData, format!("{other:?}")),
              }
          }

          '''
          assert text.count(marker) == 1
          p.write_text(text.replace(marker, adapter + marker))
          PY
          cargo check --all-targets
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tomllib
          old = tomllib.loads(subprocess.check_output(['git', 'show', '536be2c1f986c3471cbbe294d85c132645368f84:Cargo.lock'], text=True))
          new = tomllib.loads(Path('Cargo.lock').read_text())
          for package in old['package']:
              if package['name'] == 'rdp2vnc':
                  assert 'rustls-pemfile' in package['dependencies']
                  package['dependencies'].remove('rustls-pemfile')
          assert old == new, 'Unexpected resolved dependency change: review before proceeding'
          assert not any('rustls_pemfile' in p.read_text() for p in Path('src').rglob('*.rs'))
          print('Lockfile verified: only the application dependency edge was removed; no package versions changed.')
          PY
          cargo tree --locked --invert rustls-pemfile
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
          git diff --check
      - name: Publish reviewed-scope candidate on the isolated branch
        run: |
          git diff --stat
          git diff -- Cargo.toml Cargo.lock src/rfb.rs src/tls.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src/rfb.rs src/tls.rs src/rfb/pem_tests.rs src/tls/pem_tests.rs
          git commit -m 'refactor(tls): migrate direct PEM parsing to PemObject'
          git push origin HEAD:refactor/issue-11-pemobject
